<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highspeed Enterprises — Shop Manager</title>
<link rel="stylesheet" href="highspeed.css?v=4">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<div id="lockScreen" class="lock-wrap" style="display:none;">
  <div class="lock-card" id="lockCard"></div>
</div>

<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="bars"><span></span><span></span><span></span></div>
        <div>
          <div class="brand-name" id="sbShopName">Highspeed Enterprises</div>
          <div class="brand-sub">Shop Manager</div>
        </div>
      </div>
      <div class="brand-loc" id="sbShopLoc">Behind Market, Federal University Dutse</div>
    </div>
    <nav class="navlist" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="userchip" id="userChip"></div>
      <div class="clockbox"><span id="clockTime">--:--:--</span><div class="d" id="clockDate">—</div></div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Overview of today's activity</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="pill" id="netPill"><span class="dot"></span><span id="netPillText">Online</span></span>
        <button class="btn btn-sm" id="topBackupBtn" onclick="go('backup')">⇅ Backup</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<div id="printableReceipt"></div>
<div class="toast" id="toast"></div>

<script src="highspeed.js?v=4"></script>
</body>
</html>
